<template>
    <template lwc:if={isOpen}>
        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <slot name="title">
                        <h2 class="slds-modal__title">Modal</h2>
                    </slot>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <slot></slot>
                </div>
                <footer class="slds-modal__footer">
                    <slot name="actions">
                        <!-- fallback content: renders only if consumer provides nothing -->
                        <lightning-button label="Close" onclick={close}></lightning-button>
                    </slot>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" onclick={handleBackdropClick}></div>
    </template>
</template>
